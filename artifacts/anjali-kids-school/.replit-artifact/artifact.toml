kind = "web"
previewPath = "/"
title = "Anjali Kids Play School"
version = "1.0.0"
id = "artifacts/anjali-kids-school"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18727

[services.development]
run = "pnpm install --frozen-lockfile && pnpm --filter @workspace/anjali-kids-school run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anjali-kids-school", "run", "build" ]
serve = "static"
publicDir = "artifacts/anjali-kids-school/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18727"
BASE_PATH = "/"
